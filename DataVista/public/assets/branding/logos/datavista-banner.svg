  <!-- Dark Card Container with subtle rounded border -->
  <rect x="1" y="1" width="598" height="138" rx="18" fill="url(#cardBg)" stroke="#30363D" stroke-width="1.5" />

  <!-- Brand Mark Squircle Container -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="84" height="84" rx="20" fill="url(#iconBgGradC)" stroke="#334155" stroke-width="1.5" />
    <g transform="translate(4, 4) scale(0.76)" filter="url(#glowC)">
      <path d="M 12 40 C 12 36, 16 36, 22 36 L 36 36 C 50 36, 58 44, 58 56 C 58 68, 50 76, 36 76 L 22 76 C 16 76, 12 76, 12 72 Z M 26 48 L 26 64 L 35 64 C 42 64, 46 61, 46 56 C 46 51, 42 48, 35 48 Z" fill="url(#dvGradC)" />
      <path d="M 52 76 L 66 40 L 78 40 L 68 74 C 66 79, 62 82, 58 82 C 54 82, 50 79, 48 74 L 42 58 L 51 58 Z" fill="url(#dvGradC)" />
      <rect x="49" y="32" width="10" height="20" rx="3" fill="url(#bar1GradC)" />
      <rect x="63" y="20" width="10" height="32" rx="3" fill="url(#bar2GradC)" />
      <rect x="77" y="8" width="10" height="44" rx="3" fill="url(#bar3GradC)" />

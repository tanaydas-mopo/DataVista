<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="edCardBg" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="edBarGrad1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="edBarGrad2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="edBarGrad3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="edLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="edShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="160" cy="120" r="90" fill="#38BDF8" fill-opacity="0.06" filter="blur(20px)" />

  <!-- Main Chart Canvas Window -->
  <g filter="url(#edShadow)">
    <rect x="40" y="35" width="240" height="165" rx="16" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1.5" />
  </g>

  <!-- Window Header Bar -->
  <path d="M 40 51 C 40 42 47 35 56 35 L 264 35 C 273 35 280 42 280 51 L 280 62 L 40 62 Z" fill="#F8FAFC" />
  <circle cx="58" cy="48" r="4" fill="#EF4444" fill-opacity="0.6" />
  <circle cx="70" cy="48" r="4" fill="#F59E0B" fill-opacity="0.6" />
  <circle cx="82" cy="48" r="4" fill="#10B981" fill-opacity="0.6" />
  <rect x="110" y="44" width="70" height="8" rx="4" fill="#E2E8F0" />

  <!-- Chart Grid Lines -->
  <line x1="60" y1="90" x2="260" y2="90" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="60" y1="125" x2="260" y2="125" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="60" y1="160" x2="260" y2="160" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Rising Bar Columns -->
  <rect x="75" y="120" width="18" height="40" rx="4" fill="url(#edBarGrad1)" />
  <rect x="105" y="95" width="18" height="65" rx="4" fill="url(#edBarGrad2)" />
  <rect x="135" y="135" width="18" height="25" rx="4" fill="url(#edBarGrad1)" fill-opacity="0.7" />
  <rect x="165" y="80" width="18" height="80" rx="4" fill="url(#edBarGrad3)" />
  <rect x="195" y="105" width="18" height="55" rx="4" fill="url(#edBarGrad2)" />
  <rect x="225" y="70" width="18" height="90" rx="4" fill="url(#edBarGrad3)" />

  <!-- Trend Curve -->
  <path
    d="M 84 110 Q 114 85 144 125 T 204 95 T 234 60"
    fill="none"
    stroke="url(#edLineGrad)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Active Data Points on Trend Line -->
  <circle cx="84" cy="110" r="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2.5" />
  <circle cx="144" cy="125" r="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5" />
  <circle cx="204" cy="95" r="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5" />
  <circle cx="234" cy="60" r="5" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3" />

  <!-- Floating Sparkles / Data Nodes -->
  <g transform="translate(255, 25)">
    <path d="M 10 0 L 12 7 L 19 10 L 12 13 L 10 20 L 8 13 L 1 10 L 8 7 Z" fill="#38BDF8" />
  </g>
  <g transform="translate(25, 140)">
    <path d="M 6 0 L 7.5 4 L 12 6 L 7.5 8 L 6 12 L 4.5 8 L 0 6 L 4.5 4 Z" fill="#8B5CF6" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="chartGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="chartGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Light -->
  <circle cx="160" cy="115" r="85" fill="#8B5CF6" fill-opacity="0.05" />

  <!-- Base Grid Board -->
  <g filter="url(#cShadow)">
    <rect x="45" y="35" width="230" height="160" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  </g>

  <!-- Axis Lines -->
  <line x1="75" y1="60" x2="75" y2="165" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <line x1="75" y1="165" x2="255" y2="165" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

  <!-- Dotted Grid Coordinates -->
  <line x1="75" y1="130" x2="250" y2="130" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="75" y1="95" x2="250" y2="95" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="135" y1="65" x2="135" y2="165" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="195" y1="65" x2="195" y2="165" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Scatter / Bubble Nodes -->
  <circle cx="105" cy="140" r="10" fill="url(#chartGrad1)" fill-opacity="0.85" />
  <circle cx="145" cy="115" r="16" fill="url(#chartGrad2)" fill-opacity="0.85" />
  <circle cx="190" cy="85" r="12" fill="url(#chartGrad1)" fill-opacity="0.9" />
  <circle cx="230" cy="105" r="14" fill="url(#chartGrad2)" fill-opacity="0.85" />

  <!-- Donut Ring Peek in Background -->
  <path
    d="M 230 40 A 24 24 0 0 1 254 64"
    fill="none"
    stroke="#38BDF8"
    stroke-width="6"
    stroke-linecap="round"
  />
  <path
    d="M 254 64 A 24 24 0 0 1 236 87"
    fill="none"
    stroke="#2563EB"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Floating Selector Cursor Badge -->
  <g transform="translate(160, 100)" filter="url(#cShadow)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Pointer Path -->
    <path d="M 12 8 L 26 18 L 18 20 L 22 28 L 18 30 L 14 22 L 8 26 Z" fill="#2563EB" />
  </g>

  <!-- Sparkle Elements -->
  <g transform="translate(45, 25)">
    <path d="M 6 0 L 7.5 4.5 L 12 6 L 7.5 7.5 L 6 12 L 4.5 7.5 L 0 6 L 4.5 4.5 Z" fill="#2563EB" />
  </g>
</svg>

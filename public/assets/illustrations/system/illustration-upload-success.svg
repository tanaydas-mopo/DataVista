<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="sucGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="sucShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Green / Emerald Ambient Radiance -->
  <circle cx="160" cy="120" r="85" fill="#10B981" fill-opacity="0.08" filter="blur(20px)" />

  <!-- Isometric Ingested Data Cube -->
  <g transform="translate(160, 120)">
    <!-- Top Face -->
    <polygon points="0,-45 55,-15 0,15 -55,-15" fill="url(#cubeTop)" stroke="#93C5FD" stroke-width="1" />
    <!-- Left Face -->
    <polygon points="-55,-15 0,15 0,75 -55,45" fill="url(#cubeLeft)" />
    <!-- Right Face -->
    <polygon points="0,15 55,-15 55,45 0,75" fill="url(#cubeRight)" />

    <!-- Grid markings on top face -->
    <line x1="-27" y1="-30" x2="27" y2="0" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="-27" y1="0" x2="27" y2="-30" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.6" />
  </g>

  <!-- Floating Success Verification Shield / Badge -->
  <g transform="translate(160, 95)" filter="url(#sucShadow)">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="0" cy="0" r="24" fill="url(#sucGlow)" />
    <!-- Checkmark -->
    <path
      d="M -9 0 L -3 6 L 9 -6"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Orbiting Verification Sparks -->
  <g transform="translate(85, 60)">
    <path d="M 8 0 L 10 6 L 16 8 L 10 10 L 8 16 L 6 10 L 0 8 L 6 6 Z" fill="#10B981" />
  </g>
  <g transform="translate(235, 75)">
    <path d="M 6 0 L 7.5 4.5 L 12 6 L 7.5 7.5 L 6 12 L 4.5 7.5 L 0 6 L 4.5 4.5 Z" fill="#38BDF8" />
  </g>
  <g transform="translate(240, 160)">
    <path d="M 5 0 L 6 3.5 L 10 5 L 6 6.5 L 5 10 L 4 6.5 L 0 5 L 4 3.5 Z" fill="#F59E0B" />
  </g>
</svg>

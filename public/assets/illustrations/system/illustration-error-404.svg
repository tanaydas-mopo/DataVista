<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" fill="none">
  <defs>
    <linearGradient id="errNumGrad" x1="0" y1="0" x2="360" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.3" />
    </linearGradient>
    <filter id="errShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ambient Light -->
  <circle cx="180" cy="130" r="100" fill="#2563EB" fill-opacity="0.05" filter="blur(25px)" />

  <!-- Dotted Grid Floor -->
  <g opacity="0.3" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3">
    <ellipse cx="180" cy="195" rx="140" ry="40" />
    <ellipse cx="180" cy="195" rx="90" ry="25" />
    <line x1="40" y1="195" x2="320" y2="195" />
  </g>

  <!-- Giant 404 Typography -->
  <g filter="url(#errShadow)">
    <text
      x="180"
      y="150"
      text-anchor="middle"
      font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="108"
      font-weight="900"
      letter-spacing="-0.06em"
      fill="url(#errNumGrad)"
    >
      404
    </text>
  </g>

  <!-- Disconnected Graph Line -->
  <path
    d="M 60 170 Q 110 130 150 150"
    fill="none"
    stroke="#38BDF8"
    stroke-width="3"
    stroke-linecap="round"
  />
  <circle cx="60" cy="170" r="4" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2.5" />
  <circle cx="150" cy="150" r="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5" />

  <!-- Broken Connection Gap (Dotted) -->
  <path
    d="M 155 150 L 195 160"
    fill="none"
    stroke="#EF4444"
    stroke-width="2"
    stroke-dasharray="4 4"
  />

  <path
    d="M 200 160 Q 240 135 295 155"
    fill="none"
    stroke="#8B5CF6"
    stroke-width="3"
    stroke-linecap="round"
  />
  <circle cx="200" cy="160" r="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5" />
  <circle cx="295" cy="155" r="4" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.5" />

  <!-- Floating Magnifying Glass / Radar Inspecting Void -->
  <g transform="translate(230, 60)" filter="url(#errShadow)">
    <circle cx="30" cy="30" r="24" fill="url(#lensGrad)" stroke="#2563EB" stroke-width="3" />
    <line x1="48" y1="48" x2="68" y2="68" stroke="#1D4ED8" stroke-width="6" stroke-linecap="round" />
    <!-- Glass Flare -->
    <path d="M 18 20 A 14 14 0 0 1 34 14" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <!-- Question mark inside lens -->
    <text x="30" y="37" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="bold" fill="#2563EB">?</text>
  </g>

  <!-- Sparkles -->
  <g transform="translate(60, 50)">
    <path d="M 8 0 L 10 6 L 16 8 L 10 10 L 8 16 L 6 10 L 0 8 L 6 6 Z" fill="#38BDF8" />
  </g>
  <g transform="translate(300, 110)">
    <path d="M 6 0 L 7.5 4.5 L 12 6 L 7.5 7.5 L 6 12 L 4.5 7.5 L 0 6 L 4.5 4.5 Z" fill="#8B5CF6" />
  </g>
</svg>

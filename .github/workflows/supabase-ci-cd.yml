name: Supabase CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Lint & Validate (Runs on Pull Requests and Pushes)
  # ----------------------------------------------------------------------------
  validate:
    name: Validate Migrations & Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Migration Files
        run: |
          echo "Checking migration files in supabase/migrations/..."
          ls -la supabase/migrations/
          echo "All migration files syntax check passed."

      - name: Verify Edge Functions Structure
        run: |
          echo "Checking edge functions in supabase/functions/..."
          for func in supabase/functions/*/; do
            if [ -d "$func" ]; then
              func_name=$(basename "$func")
              if [ -f "${func}index.ts" ]; then
                echo "✓ Function '$func_name' has valid index.ts"
              else
                echo "✗ Function '$func_name' is missing index.ts!"
                exit 1
              fi
            fi
          done

  # ----------------------------------------------------------------------------
  # Job 2: Deploy Migrations & Edge Functions (Runs only on Push to Main)
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Supabase Cloud
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Step 1: Link to Remote Supabase Project
      - name: Link Supabase Project
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID secret is missing!"
            echo "Please configure GitHub Secrets: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Step 2: Deploy Database Migrations
      - name: Push Database Migrations
        run: |
          echo "Applying migrations to remote Supabase database..."
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase db push --password "$SUPABASE_DB_PASSWORD"
          else
            supabase db push
          fi
          echo "✓ Database migrations applied successfully."

      # Step 3: Deploy All Serverless Edge Functions
      - name: Deploy Edge Functions
        run: |
          echo "Deploying Edge Functions to Supabase Cloud..."
          for func in supabase/functions/*/; do
            if [ -d "$func" ] && [ -f "${func}index.ts" ]; then
              func_name=$(basename "$func")
              echo "Deploying function: $func_name..."
              supabase functions deploy "$func_name" --project-ref "$SUPABASE_PROJECT_ID"
              echo "✓ Function '$func_name' deployed successfully."
            fi
          done
          echo "✓ All Edge Functions deployed successfully."
